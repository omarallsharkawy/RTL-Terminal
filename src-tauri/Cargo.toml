[package]
name = "twitty"
version = "1.2.0"
description = "A Windows terminal that gets Arabic right"
authors = ["Twitty Project Contributors"]
homepage = "https://github.com/omarallsharkawy/RTL-Terminal"
edition = "2021"
rust-version = "1.88"

[lib]
name = "rtl_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[features]
default = []
