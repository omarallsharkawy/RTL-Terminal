[package]
name = "twitty"
version = "2.0.1"
edition = "2021"
authors = ["Omar Sharkawy"]
description = "Twitty - Native Bidirectional RTL Terminal Emulator"
license = "MIT"

[dependencies]
portable-pty = "0.9.0"
alacritty_terminal = "0.26.0"
cosmic_text = { package = "cosmic-text", version = "0.19.0" }
winit = { version = "0.30.12", features = ["rwh_06"] }
wgpu = "30.0.0"
glyphon = "0.12.0"
pollster = "1.0.1"
unicode-bidi = "0.3.17"
unicode-width = "0.2.0"
anyhow = "1.0.95"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
bytemuck = { version = "1.21.0", features = ["derive"] }
arboard = "3.6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
