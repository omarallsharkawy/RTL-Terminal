[package]
name = "twitty-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
twitty = { path = ".." }
cosmic_text = { package = "cosmic-text", version = "0.19.0" }

# Not part of the main build: run with `cargo +nightly fuzz run <target>`.
[workspace]
members = ["."]

[[bin]]
name = "terminal_bytes"
path = "fuzz_targets/terminal_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shape_rows"
path = "fuzz_targets/shape_rows.rs"
test = false
doc = false
bench = false
