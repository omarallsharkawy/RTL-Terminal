name: Build RTL Terminal

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  rust-quality:
    name: Rust fmt, clippy and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install D-Bus headers and test shells (bash, zsh, fish)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config zsh fish
      - name: Setup Rust stable with fmt and clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust with clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee test-output.txt

      # Job logs need a sign-in; annotations are public, so surface the failures there.
      - name: Report failing tests
        if: failure()
        shell: bash
        run: |
          summary=$(grep -E -A4 '^test .* FAILED$|panicked at' test-output.txt | grep -v '^note:' | head -80 || true)
          summary=${summary//'%'/'%25'}
          summary=${summary//$'\r'/}
          summary=${summary//$'\n'/'%0A'}
          echo "::error title=Failing tests::${summary:-no test names found}"

  build-windows:
    name: Build Windows binary
    needs: rust-quality
    runs-on: windows-latest

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2

      - name: Build release executable
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package Windows release zip
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq twitty | Select-Object -ExpandProperty version
          $stage = "dist/twitty-$version-windows-x86_64"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force "$stage/licenses" | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/twitty.exe "$stage/twitty.exe"
          Copy-Item LICENSE "$stage/LICENSE"
          Copy-Item README.md "$stage/README.md"
          Copy-Item assets/fonts/OFL.txt "$stage/licenses/OFL.txt"
          Get-ChildItem -File licenses | ForEach-Object { Copy-Item $_.FullName "$stage/licenses/$($_.Name)" }
          $zip = "dist/twitty-$version-windows-x86_64.zip"
          if (Test-Path $zip) { Remove-Item -Force $zip }
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          Remove-Item -Recurse -Force $stage

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: twitty-windows
          if-no-files-found: error
          path: dist/twitty-*-windows-x86_64.zip

  build-linux:
    name: Build Linux binary
    needs: rust-quality
    runs-on: ubuntu-latest

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install D-Bus headers (keyring Secret Service)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Install SVG rasterizer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2

      - name: Build release executable
        run: cargo build --release

      - name: Package the release tarball
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "twitty") | .version')
          stage="dist/twitty-$version-linux-x86_64"
          rm -rf "$stage"
          mkdir -p "$stage/bin" \
            "$stage/share/applications" \
            "$stage/share/metainfo" \
            "$stage/share/icons/hicolor/scalable/apps" \
            "$stage/share/licenses/twitty"

          install -m755 target/release/twitty "$stage/bin/twitty"
          install -m755 target/release/twitty-remote "$stage/bin/twitty-remote"
          install -m755 packaging/linux/install.sh "$stage/install.sh"
          install -m644 LICENSE "$stage/LICENSE"
          install -m644 README.md "$stage/README.md"

          install -m644 packaging/linux/twitty.desktop "$stage/share/applications/twitty.desktop"
          install -m644 packaging/linux/dev.twitty.Twitty.metainfo.xml \
            "$stage/share/metainfo/dev.twitty.Twitty.metainfo.xml"
          install -m644 packaging/linux/icons/hicolor/scalable/apps/twitty.svg \
            "$stage/share/icons/hicolor/scalable/apps/twitty.svg"

          for size in 16 24 32 48 64 128 256 512; do
            mkdir -p "$stage/share/icons/hicolor/${size}x${size}/apps"
            rsvg-convert -w "$size" -h "$size" packaging/linux/icons/hicolor/scalable/apps/twitty.svg \
              -o "$stage/share/icons/hicolor/${size}x${size}/apps/twitty.png"
          done

          install -m644 LICENSE "$stage/share/licenses/twitty/LICENSE"
          install -m644 assets/fonts/OFL.txt "$stage/share/licenses/twitty/OFL.txt"
          for f in licenses/*; do
            [ -f "$f" ] || continue
            install -m644 "$f" "$stage/share/licenses/twitty/$(basename "$f")"
          done

          tar -czf "dist/twitty-$version-linux-x86_64.tar.gz" -C dist "twitty-$version-linux-x86_64"
          rm -rf "$stage"

      - name: Upload Linux build artifact
        uses: actions/upload-artifact@v4
        with:
          name: twitty-linux
          if-no-files-found: error
          path: dist/twitty-*-linux-x86_64.tar.gz

  build-appimage:
    name: Build Linux AppImage
    needs: build-linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux release tarball
        uses: actions/download-artifact@v4
        with:
          name: twitty-linux
          path: ./linux-tarball

      - name: Install desktop validation and SVG tools
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin desktop-file-utils appstream

      - name: Validate desktop integration files
        run: |
          desktop-file-validate packaging/linux/twitty.desktop
          appstreamcli validate --no-net packaging/linux/dev.twitty.Twitty.metainfo.xml

      - name: Download and verify appimagetool
        run: |
          APPIMAGETOOL_VERSION="1.9.1"
          APPIMAGETOOL_SHA256="ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
          curl -fsSL -o appimagetool-x86_64.AppImage \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          echo "${APPIMAGETOOL_SHA256}  appimagetool-x86_64.AppImage" | sha256sum -c -
          chmod +x appimagetool-x86_64.AppImage

      - name: Build x86_64 AppImage
        run: |
          tarball=$(ls linux-tarball/twitty-*-linux-x86_64.tar.gz)
          mkdir -p extracted
          tar -xzf "$tarball" -C extracted
          unpacked=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)
          version=$(basename "$unpacked" | sed 's/^twitty-//; s/-linux-x86_64$//')
          ./packaging/linux/build-appimage.sh \
            --bin-dir "$unpacked/bin" \
            --version "$version" \
            --appimagetool ./appimagetool-x86_64.AppImage \
            --rasterize \
            --out "dist/twitty-${version}-linux-x86_64.AppImage"

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: twitty-appimage
          if-no-files-found: error
          path: dist/*.AppImage

  msrv:
    name: Minimum supported Rust (1.90)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install D-Bus headers (keyring Secret Service)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Setup Rust 1.90
        uses: dtolnay/rust-toolchain@1.90

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2

      - name: Check the workspace builds on the declared rust-version
        run: cargo check --workspace --all-targets

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install D-Bus headers and test shells (bash, zsh, fish)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config zsh fish
      - name: Setup Rust stable with llvm-tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Measure line coverage
        shell: bash
        run: |
          set -o pipefail
          cargo llvm-cov --workspace --release --summary-only --no-fail-fast 2>&1 | tee test-output.txt

      # Job logs need a sign-in; annotations are public, so surface the failures there.
      - name: Report failing tests
        if: failure()
        shell: bash
        run: |
          summary=$(grep -E -A4 '^test .* FAILED$|panicked at' test-output.txt | grep -v '^note:' | head -80 || true)
          summary=${summary//'%'/'%25'}
          summary=${summary//$'\r'/}
          summary=${summary//$'\n'/'%0A'}
          echo "::error title=Failing tests::${summary:-no test names found}"

  fuzz:
    name: Fuzz (short run)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install D-Bus headers (keyring Secret Service)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Fuzz each target for 60 seconds
        run: |
          # The prebuilt cargo-fuzz defaults to its own (musl) target.
          cargo fuzz run --target x86_64-unknown-linux-gnu terminal_bytes -- -max_total_time=60
          cargo fuzz run --target x86_64-unknown-linux-gnu shape_rows -- -max_total_time=60
          cargo fuzz run --target x86_64-unknown-linux-gnu control_protocol -- -max_total_time=30
          cargo fuzz run --target x86_64-unknown-linux-gnu redact_secrets -- -max_total_time=30
          cargo fuzz run --target x86_64-unknown-linux-gnu review_diff -- -max_total_time=30
          cargo fuzz run --target x86_64-unknown-linux-gnu agent_policy -- -max_total_time=30

  golden:
    name: Golden-image rendering tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install D-Bus headers (keyring Secret Service)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Install Mesa software rendering
        run: sudo apt-get update && sudo apt-get install -y libegl-mesa0 libgl1-mesa-dri mesa-vulkan-drivers

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2

      - name: Compare rendered scenes with the reference images
        env:
          TWITTY_REQUIRE_GOLDEN: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: cargo test --release --test golden_tests

      - name: Upload mismatches
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: target/tmp/golden-failures/

  rust-licenses:
    name: Dependency licenses and sources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check licenses, bans and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  rust-security:
    name: Audit Rust dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux, build-appimage, rust-quality, msrv, rust-licenses, rust-security, fuzz, golden]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: twitty-*
          path: ./artifacts
          merge-multiple: true

      - name: Verify tag matches Cargo.toml and expected artifacts exist
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(awk '
            /^\[workspace\.package\][[:space:]]*$/ { in_pkg = 1; next }
            /^\[/ { in_pkg = 0 }
            in_pkg && /^version[[:space:]]*=/ {
              val = $0
              sub(/^version[[:space:]]*=[[:space:]]*"/, "", val)
              sub(/".*$/, "", val)
              print val
              exit
            }
          ' Cargo.toml)"
          if [ "$version" != "$cargo_version" ]; then
            echo "Tag v$version does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi
          for asset in \
            "twitty-${version}-linux-x86_64.AppImage" \
            "twitty-${version}-linux-x86_64.tar.gz" \
            "twitty-${version}-windows-x86_64.zip"; do
            if [ ! -f "./artifacts/${asset}" ]; then
              echo "Missing expected release artifact: ${asset}" >&2
              ls -la ./artifacts >&2
              exit 1
            fi
          done

      - name: Generate SHA-256 checksums
        working-directory: ./artifacts
        run: |
          version="${GITHUB_REF_NAME#v}"
          ls -la
          LC_ALL=C sha256sum \
            "twitty-${version}-linux-x86_64.AppImage" \
            "twitty-${version}-linux-x86_64.tar.gz" \
            "twitty-${version}-windows-x86_64.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            BEGIN { prefix = "## " v; plen = length(prefix) }
            !found && substr($0, 1, plen) == prefix {
              rest = substr($0, plen + 1)
              if (rest == "" || substr(rest, 1, 1) == " ") { found = 1; next }
            }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no non-empty section for $version" >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Twitty $GITHUB_REF_NAME" \
            --notes-file release-notes.md
