name: Build RTL Terminal

on:
  workflow_dispatch:
  push:
    branches: [main, master, v2-native]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux Native App
    runs-on: ubuntu-latest

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2

      - name: Check Rust
        run: cargo check

      - name: Run Tests
        run: cargo test

      - name: Build Release
        run: cargo build --release

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: twitty-linux-x64
          path: target/release/twitty

  build-windows:
    name: Build Windows desktop app
    runs-on: windows-latest

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2

      - name: Check Rust
        run: cargo check --target x86_64-pc-windows-msvc

      - name: Build Windows App
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: twitty-windows-x64
          path: target/x86_64-pc-windows-msvc/release/twitty.exe

  rust-quality:
    name: Rust fmt, tests, and clippy
    runs-on: ubuntu-latest

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev

      - name: Setup Rust stable with fmt and clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: cargo fmt -- --check

      - name: Lint Rust with clippy
        run: cargo clippy --all-targets -- -D warnings
