name: Build RTL Terminal

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows desktop app
    runs-on: windows-latest

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust stable MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Normalize config encoding
        run: node scripts/normalize-config.cjs

      - name: Run frontend regression tests
        run: npm test

      - name: Typecheck and build frontend
        run: npm run build

      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build Tauri Windows app
        run: npm run tauri:build -- --target x86_64-pc-windows-msvc --bundles nsis --ci --no-sign

      - name: List build outputs
        if: always()
        shell: pwsh
        run: |
          if (Test-Path src-tauri/target/x86_64-pc-windows-msvc/release) {
            Get-ChildItem -Recurse src-tauri/target/x86_64-pc-windows-msvc/release/bundle -ErrorAction SilentlyContinue | Select-Object FullName, Length
            Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release -Filter *.exe -ErrorAction SilentlyContinue | Select-Object FullName, Length
          }
          if (Test-Path src-tauri/target/release) {
            Get-ChildItem -Recurse src-tauri/target/release/bundle -ErrorAction SilentlyContinue | Select-Object FullName, Length
            Get-ChildItem src-tauri/target/release -Filter *.exe -ErrorAction SilentlyContinue | Select-Object FullName, Length
          }

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: twitty-windows-installer
          if-no-files-found: error
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi

  rust-quality:
    name: Rust fmt, tests, and clippy
    runs-on: windows-latest

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable with fmt and clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust with clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  release:
    name: Create GitHub Release
    needs: [build-windows, rust-quality]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: twitty-windows-installer
          path: ./artifacts-windows

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem -Recurse ./artifacts-windows | Select-Object FullName, Length

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            Get-ChildItem -Recurse ./artifacts-windows -File |
              Where-Object { $_.Extension -in '.exe', '.msi' } |
              Select-Object -ExpandProperty FullName
          )
          if ($assets.Count -eq 0) {
            Write-Error "No Windows release assets found."
            exit 1
          }

          & gh release create $env:GITHUB_REF_NAME @assets `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Twitty $env:GITHUB_REF_NAME" `
            --notes-file CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
