name: Build RTL Terminal

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  rust-quality:
    name: Rust fmt, clippy and tests
    runs-on: windows-latest

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable with fmt and clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: cargo fmt -- --check

      - name: Lint Rust with clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test

  build-windows:
    name: Build Windows executable
    needs: rust-quality
    runs-on: windows-latest

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2

      - name: Build release executable
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: twitty-windows-installer
          if-no-files-found: error
          path: target/x86_64-pc-windows-msvc/release/twitty.exe

  rust-security:
    name: Audit Rust dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Create GitHub Release
    needs: [build-windows, rust-quality, rust-security]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: twitty-windows-installer
          path: ./artifacts-windows

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem -Recurse ./artifacts-windows | Select-Object FullName, Length

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $releaseFiles = @(
            Get-ChildItem -Recurse ./artifacts-windows -File |
              Where-Object { $_.Extension -in '.exe', '.msi' }
          )
          if ($releaseFiles.Count -eq 0) {
            Write-Error "No Windows release assets found."
            exit 1
          }

          $checksums = @(
            foreach ($file in $releaseFiles) {
              $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($file.Name)"
            }
          )
          $checksums | Set-Content -LiteralPath ./artifacts-windows/SHA256SUMS.txt -Encoding ascii

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            Get-ChildItem -Recurse ./artifacts-windows -File |
              Where-Object { $_.Extension -in '.exe', '.msi' } |
              Select-Object -ExpandProperty FullName
          )
          if ($assets.Count -eq 0) {
            Write-Error "No Windows release assets found."
            exit 1
          }
          $assets += (Resolve-Path ./artifacts-windows/SHA256SUMS.txt).Path

          & gh release create $env:GITHUB_REF_NAME @assets `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Twitty $env:GITHUB_REF_NAME" `
            --notes-file CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
